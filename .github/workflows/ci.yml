name: CI

on:
  workflow_dispatch:
    inputs:
      debug:
        description: Run Linux Debug build and tests (enabled for a full run)
        required: true
        default: true
        type: boolean
      asan:
        description: Run Linux ASan build and tests (enabled for a full run)
        required: true
        default: true
        type: boolean
      tsan:
        description: Run Linux TSan build and tests (enabled for a full run)
        required: true
        default: true
        type: boolean
      macos:
        description: Run macOS Debug build and tests (enabled for a full run)
        required: true
        default: true
        type: boolean
      lint:
        description: Run formatting and clang-tidy (enabled for a full run)
        required: true
        default: true
        type: boolean

jobs:
  selection:
    runs-on: ubuntu-24.04
    outputs:
      linux_profiles: ${{ steps.profiles.outputs.linux_profiles }}
      tdlib_os: ${{ steps.profiles.outputs.tdlib_os }}
    steps:
      - name: Validate and resolve selected profiles
        id: profiles
        env:
          PROFILE_SELECTION: >-
            {"debug":${{ inputs.debug }},"asan":${{ inputs.asan }},"tsan":${{ inputs.tsan }},"macos":${{ inputs.macos }},"lint":${{ inputs.lint }}}
        run: |
          python3 - <<'PY'
          import json
          import os

          selection = json.loads(os.environ["PROFILE_SELECTION"])
          if not any(selection.values()):
              print("::error::Select at least one CI profile.")
              raise SystemExit(1)

          linux_profiles = [
              profile for profile in ("debug", "asan", "tsan") if selection[profile]
          ]
          tdlib_os = []
          if linux_profiles or selection["lint"]:
              tdlib_os.append("ubuntu-24.04")
          if selection["macos"]:
              tdlib_os.append("macos-14")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(
                  "linux_profiles="
                  + json.dumps(linux_profiles, separators=(",", ":")),
                  file=output,
              )
              print(
                  "tdlib_os=" + json.dumps(tdlib_os, separators=(",", ":")),
                  file=output,
              )
          PY

  # Builds the tdlib prefix once per OS and saves it to the actions cache so
  # a cold cache doesn't make every test/lint job build tdlib from source.
  # Downstream jobs keep their own conditional build step as a fallback
  # against cache eviction.
  tdlib:
    needs: selection
    strategy:
      matrix:
        os: ${{ fromJSON(needs.selection.outputs.tdlib_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tdlib prefix path
        id: tdlib
        run: echo "prefix=$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7" >> "$GITHUB_OUTPUT"

      - name: Cache tdlib prefix
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.tdlib.outputs.prefix }}
            ~/.cache/tgcli-dev/td
          key: tdlib-${{ runner.os }}-a17f87c4cff7b90b278d12b91ba0614383aaee82-v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev ninja-build ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS' && steps.tdlib-cache.outputs.cache-hit != 'true'
        run: brew install gperf ninja ccache coreutils

      - name: Build tdlib prefix
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        # macOS: build-tdlib.sh installs headers with GNU install/cp flags;
        # coreutils' gnubin provides them (and nproc) ahead of the BSD tools.
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export PATH="$(brew --prefix)/opt/coreutils/libexec/gnubin:$PATH"
          fi
          ./scripts/build-tdlib.sh "${{ steps.tdlib.outputs.prefix }}"

  test:
    needs: [selection, tdlib]
    if: ${{ needs.selection.outputs.linux_profiles != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.selection.outputs.linux_profiles) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev ninja-build ccache zsh

      - name: Resolve tdlib prefix path
        id: tdlib
        run: echo "prefix=$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7" >> "$GITHUB_OUTPUT"

      - name: Cache tdlib prefix
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.tdlib.outputs.prefix }}
            ~/.cache/tgcli-dev/td
          key: tdlib-${{ runner.os }}-a17f87c4cff7b90b278d12b91ba0614383aaee82-v5

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: Build tdlib prefix
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tdlib.sh "${{ steps.tdlib.outputs.prefix }}"

      - name: Configure
        run: >-
          TDLIB_SRC="$HOME/.cache/tgcli-dev/td"
          TGCLI_TDLIB_PREFIX="${{ steps.tdlib.outputs.prefix }}"
          cmake --preset ${{ matrix.preset }}

      - name: Build
        # setarch -R: gcc's TSan runtime rejects vm.mmap_rnd_bits > 28, and
        # Catch2 test discovery executes the binary at build time.
        run: |
          if [ "${{ matrix.preset }}" = "tsan" ]; then
            setarch "$(uname -m)" -R cmake --build --preset ${{ matrix.preset }}
          else
            cmake --build --preset ${{ matrix.preset }}
          fi

      - name: Test
        run: |
          if [ "${{ matrix.preset }}" = "tsan" ]; then
            setarch "$(uname -m)" -R ctest --preset ${{ matrix.preset }}
          else
            ctest --preset ${{ matrix.preset }}
          fi

  test-macos:
    needs: [selection, tdlib]
    if: ${{ inputs.macos }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install gperf ninja ccache coreutils
          command -v zsh >/dev/null

      - name: Resolve tdlib prefix path
        id: tdlib
        run: echo "prefix=$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7" >> "$GITHUB_OUTPUT"

      - name: Cache tdlib prefix
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.tdlib.outputs.prefix }}
            ~/.cache/tgcli-dev/td
          key: tdlib-${{ runner.os }}-a17f87c4cff7b90b278d12b91ba0614383aaee82-v5

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-debug-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-debug-

      - name: Build tdlib prefix
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        # build-tdlib.sh installs headers with GNU install/cp flags; coreutils'
        # gnubin provides them (and nproc) ahead of the BSD tools.
        run: |
          export PATH="$(brew --prefix)/opt/coreutils/libexec/gnubin:$PATH"
          ./scripts/build-tdlib.sh "${{ steps.tdlib.outputs.prefix }}"

      - name: Configure
        run: >-
          TDLIB_SRC="$HOME/.cache/tgcli-dev/td"
          TGCLI_TDLIB_PREFIX="${{ steps.tdlib.outputs.prefix }}"
          cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  lint:
    needs: [selection, tdlib]
    if: ${{ inputs.lint }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev ninja-build ccache \
            clang-format-18 clang-tidy-18

      - name: clang-format
        run: |
          shopt -s globstar
          clang-format-18 --dry-run -Werror src/**/*.hpp src/**/*.cpp tests/*.cpp

      - name: Cache tdlib prefix
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tgcli-dev/tdlib-a17f87c4cff7
            ~/.cache/tgcli-dev/td
          key: tdlib-${{ runner.os }}-a17f87c4cff7b90b278d12b91ba0614383aaee82-v5

      - name: Build tdlib prefix
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tdlib.sh "$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7"

      - name: clang-tidy
        run: |
          TDLIB_SRC="$HOME/.cache/tgcli-dev/td" \
            TGCLI_TDLIB_PREFIX="$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7" \
            cmake --preset tidy
          shopt -s globstar
          clang-tidy-18 -p build/tidy --warnings-as-errors='*' \
            src/**/*.cpp tests/*.cpp
