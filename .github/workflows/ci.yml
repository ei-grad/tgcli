name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Builds the tdlib prefix once per OS and saves it to the actions cache so
  # a cold cache doesn't make every test/lint job build tdlib from source.
  # Downstream jobs keep their own conditional build step as a fallback
  # against cache eviction.
  tdlib:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tdlib prefix path
        id: tdlib
        run: echo "prefix=$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7" >> "$GITHUB_OUTPUT"

      - name: Cache tdlib prefix
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.tdlib.outputs.prefix }}
            ~/.cache/tgcli-dev/td
          key: tdlib-${{ runner.os }}-a17f87c4cff7b90b278d12b91ba0614383aaee82-v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev ninja-build ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS' && steps.tdlib-cache.outputs.cache-hit != 'true'
        run: brew install gperf ninja ccache coreutils

      - name: Build tdlib prefix
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        # macOS: build-tdlib.sh installs headers with GNU install/cp flags;
        # coreutils' gnubin provides them (and nproc) ahead of the BSD tools.
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export PATH="$(brew --prefix)/opt/coreutils/libexec/gnubin:$PATH"
          fi
          ./scripts/build-tdlib.sh "${{ steps.tdlib.outputs.prefix }}"

  test:
    needs: tdlib
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, tsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev ninja-build ccache zsh

      - name: Resolve tdlib prefix path
        id: tdlib
        run: echo "prefix=$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7" >> "$GITHUB_OUTPUT"

      - name: Cache tdlib prefix
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.tdlib.outputs.prefix }}
            ~/.cache/tgcli-dev/td
          key: tdlib-${{ runner.os }}-a17f87c4cff7b90b278d12b91ba0614383aaee82-v5

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: Build tdlib prefix
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tdlib.sh "${{ steps.tdlib.outputs.prefix }}"

      - name: Configure
        run: >-
          TDLIB_SRC="$HOME/.cache/tgcli-dev/td"
          TGCLI_TDLIB_PREFIX="${{ steps.tdlib.outputs.prefix }}"
          cmake --preset ${{ matrix.preset }}

      - name: Build
        # setarch -R: gcc's TSan runtime rejects vm.mmap_rnd_bits > 28, and
        # Catch2 test discovery executes the binary at build time.
        run: |
          if [ "${{ matrix.preset }}" = "tsan" ]; then
            setarch "$(uname -m)" -R cmake --build --preset ${{ matrix.preset }}
          else
            cmake --build --preset ${{ matrix.preset }}
          fi

      - name: Test
        run: |
          if [ "${{ matrix.preset }}" = "tsan" ]; then
            setarch "$(uname -m)" -R ctest --preset ${{ matrix.preset }}
          else
            ctest --preset ${{ matrix.preset }}
          fi

  test-macos:
    needs: tdlib
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install gperf ninja ccache coreutils
          command -v zsh >/dev/null

      - name: Resolve tdlib prefix path
        id: tdlib
        run: echo "prefix=$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7" >> "$GITHUB_OUTPUT"

      - name: Cache tdlib prefix
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.tdlib.outputs.prefix }}
            ~/.cache/tgcli-dev/td
          key: tdlib-${{ runner.os }}-a17f87c4cff7b90b278d12b91ba0614383aaee82-v5

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-debug-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-debug-

      - name: Build tdlib prefix
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        # build-tdlib.sh installs headers with GNU install/cp flags; coreutils'
        # gnubin provides them (and nproc) ahead of the BSD tools.
        run: |
          export PATH="$(brew --prefix)/opt/coreutils/libexec/gnubin:$PATH"
          ./scripts/build-tdlib.sh "${{ steps.tdlib.outputs.prefix }}"

      - name: Configure
        run: >-
          TDLIB_SRC="$HOME/.cache/tgcli-dev/td"
          TGCLI_TDLIB_PREFIX="${{ steps.tdlib.outputs.prefix }}"
          cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  lint:
    needs: tdlib
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev ninja-build ccache \
            clang-format-18 clang-tidy-18

      - name: clang-format
        run: |
          shopt -s globstar
          clang-format-18 --dry-run -Werror src/**/*.hpp src/**/*.cpp tests/*.cpp

      - name: Cache tdlib prefix
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tgcli-dev/tdlib-a17f87c4cff7
            ~/.cache/tgcli-dev/td
          key: tdlib-${{ runner.os }}-a17f87c4cff7b90b278d12b91ba0614383aaee82-v5

      - name: Build tdlib prefix
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tdlib.sh "$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7"

      - name: clang-tidy
        run: |
          TDLIB_SRC="$HOME/.cache/tgcli-dev/td" \
            TGCLI_TDLIB_PREFIX="$HOME/.cache/tgcli-dev/tdlib-a17f87c4cff7" \
            cmake --preset tidy
          shopt -s globstar
          clang-tidy-18 -p build/tidy --warnings-as-errors='*' \
            src/**/*.cpp tests/*.cpp
